
name: Build amarPlayer Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-windows:

    name: Build amarPlayer Windows x64

    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.12 X64
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: powershell
        run: |

          python -m pip install --upgrade pip

          python -m pip install `
            nuitka `
            PySide6 `
            mutagen `
            Pillow `
            gstreamer-bundle==1.28.7


      # ============================================================
      # 4. VERIFY PYTHON / GI / GSTREAMER
      # ============================================================

      - name: Verify Python and GStreamer
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "Python"
          Write-Host "=========================================="

          python --version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PyGObject"
          Write-Host "=========================================="

          python -c "import gi; print('PyGObject OK:', gi.__file__)"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GStreamer"
          Write-Host "=========================================="

          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; Gst.init(None); print('GStreamer OK:', Gst.version_string())"


      # ============================================================
      # 5. TEST amarPlayer IMPORT
      # ============================================================

      - name: Test amarPlayer import
        shell: powershell
        run: |

          python -c "import amarPlayer; print('amarPlayer import OK')"


      # ============================================================
      # 6. BUILD amarPlayer WITH NUITKA
      #
      # IMPORTANT:
      # Jangan menggunakan:
      # --product-name
      # --company-name
      # --file-description
      # --file-version
      # --product-version
      #
      # Karena Nuitka Windows version information dapat memicu
      # error apabila metadata tidak lengkap.
      # ============================================================

      - name: Build amarPlayer with Nuitka
        shell: powershell
        run: |

          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --enable-plugin=gi `
            --follow-imports `
            --include-package=gi `
            --include-package-data=gi `
            --include-package=mutagen `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            amarPlayer.py


      # ============================================================
      # 7. VERIFY NUITKA OUTPUT
      # ============================================================

      - name: Verify Nuitka output
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          Write-Host "=========================================="
          Write-Host "Checking Nuitka output"
          Write-Host "=========================================="

          if (-not (Test-Path $app)) {

              Write-Error "amarPlayer.dist tidak ditemukan."

              Write-Host ""
              Write-Host "Isi folder build:"
              Get-ChildItem `
                "$env:GITHUB_WORKSPACE\build" `
                -Recurse `
                -ErrorAction SilentlyContinue

              exit 1
          }

          if (-not (Test-Path "$app\amarPlayer.exe")) {

              Write-Error "amarPlayer.exe tidak ditemukan."

              Get-ChildItem `
                $app `
                -Recurse `
                -ErrorAction SilentlyContinue

              exit 1
          }

          Write-Host ""
          Write-Host "Nuitka build berhasil."
          Write-Host ""
          Get-ChildItem $app -File | Select-Object Name, Length


      # ============================================================
      # 8. FIND PYTHON SITE-PACKAGES
      # ============================================================

      - name: Locate Python packages
        shell: powershell
        run: |

          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"

          if (-not (Test-Path $site)) {

              Write-Error "Python site-packages tidak ditemukan."

              exit 1
          }

          "PYTHON_SITE=$site" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Python site-packages:"
          Write-Host $site


      # ============================================================
      # 9. INSPECT GSTREAMER PACKAGE
      # ============================================================

      - name: Inspect GStreamer package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "GStreamer files"
          Write-Host "=========================================="

          Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "gstreamer|gobject|glib|gio|gst"
            } |
            Select-Object FullName


      # ============================================================
      # 10. PREPARE GSTREAMER DIRECTORIES
      # ============================================================

      - name: Prepare GStreamer directories
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\gstreamer-1.0" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\girepository-1.0" |
            Out-Null

          Write-Host "GStreamer directories prepared."


      # ============================================================
      # 11. COPY GSTREAMER DLL
      # ============================================================

      - name: Bundle GStreamer DLL
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          Write-Host "Searching DLL files..."

          $dlls = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          if (-not $dlls) {

              Write-Error "Tidak ada DLL ditemukan."

              exit 1
          }

          $copied = 0

          foreach ($dll in $dlls) {

              $name = $dll.Name.ToLower()

              if (
                  $name -match "^gstreamer" -or
                  $name -match "^gst" -or
                  $name -match "^libgst" -or
                  $name -match "^glib" -or
                  $name -match "^gobject" -or
                  $name -match "^gio" -or
                  $name -match "^gmodule" -or
                  $name -match "^ffi"
              ) {

                  Write-Host "Copy DLL:"
                  Write-Host $dll.FullName

                  Copy-Item `
                    $dll.FullName `
                    "$app\gstreamer\" `
                    -Force

                  $copied++
              }
          }

          Write-Host ""
          Write-Host "Total DLL copied: $copied"

          if ($copied -eq 0) {

              Write-Error "Tidak ada GStreamer DLL yang berhasil disalin."

              exit 1
          }


      # ============================================================
      # 12. COPY GSTREAMER PLUGINS
      # ============================================================

      - name: Bundle GStreamer plugins
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $pluginDir = "$app\gstreamer\lib\gstreamer-1.0"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $pluginDir |
            Out-Null

          Write-Host "Searching GStreamer plugins..."

          $plugins = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          $copied = 0

          foreach ($plugin in $plugins) {

              $name = $plugin.Name.ToLower()

              if (
                  $name -match "gst" -or
                  $name -match "gstreamer"
              ) {

                  Write-Host "Plugin:"
                  Write-Host $plugin.FullName

                  Copy-Item `
                    $plugin.FullName `
                    $pluginDir `
                    -Force

                  $copied++
              }
          }

          Write-Host ""
          Write-Host "Total plugin DLL copied: $copied"


      # ============================================================
      # 13. COPY TYPELIB
      # ============================================================

      - name: Bundle GObject typelibs
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $typeDir = `
            "$app\gstreamer\lib\girepository-1.0"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $typeDir |
            Out-Null

          $typelibs = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -Filter "*.typelib" `
            -ErrorAction SilentlyContinue

          if ($typelibs) {

              foreach ($type in $typelibs) {

                  Write-Host "Typelib:"
                  Write-Host $type.FullName

                  Copy-Item `
                    $type.FullName `
                    $typeDir `
                    -Force
              }

          } else {

              Write-Warning "Tidak ditemukan typelib."

          }


      # ============================================================
      # 14. COPY APPLICATION ICON
      # ============================================================

      - name: Copy amarPlayer icon
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          if (-not (Test-Path "amarPlayer.png")) {

              Write-Error "amarPlayer.png tidak ditemukan."

              exit 1
          }

          Copy-Item `
            "amarPlayer.png" `
            "$app\amarPlayer.png" `
            -Force


      # ============================================================
      # 15. CREATE WINDOWS LAUNCHER
      # ============================================================

      - name: Create amarPlayer launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"

          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe" %*
          "@ |
          Set-Content `
            "$app\amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # 16. CREATE TEST LAUNCHER
      # ============================================================

      - name: Create test launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"

          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe"
          "@ |
          Set-Content `
            "$app\test-amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # 17. VERIFY FINAL APPLICATION DIRECTORY
      # ============================================================

      - name: Verify bundled application
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL APPLICATION DIRECTORY"
          Write-Host "=========================================="
          Write-Host ""

          Get-ChildItem `
            $app `
            -Recurse `
            -File |
            Select-Object FullName, Length


      # ============================================================
      # 18. TEST COMPILED APPLICATION
      # ============================================================

      - name: Test compiled amarPlayer
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $env:PATH = `
            "$app\gstreamer;$app;$env:PATH"

          $env:GST_PLUGIN_PATH = `
            "$app\gstreamer\lib\gstreamer-1.0"

          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = ""

          $env:GI_TYPELIB_PATH = `
            "$app\gstreamer\lib\girepository-1.0"

          Write-Host "Testing amarPlayer.exe..."

          & "$app\amarPlayer.exe" --help

          if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "amarPlayer.exe returned exit code $LASTEXITCODE."

          } else {

              Write-Host "amarPlayer.exe test passed."

          }


      # ============================================================
      # 19. INSTALL INNO SETUP
      # ============================================================

      - name: Install Inno Setup
        shell: powershell
        run: |

          choco install innosetup `
            --yes `
            --no-progress


      # ============================================================
      # 20. CREATE INSTALLER DIRECTORIES
      # ============================================================

      - name: Prepare installer directories
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path installer |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path release |
            Out-Null


      # ============================================================
      # 21. CREATE INNO SETUP SCRIPT
      # ============================================================

      - name: Create Inno Setup script
        shell: powershell
        run: |

          @"
          #define MyAppName "amarPlayer"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Muammar"
          #define MyAppExeName "amarPlayer.exe"

          [Setup]

          AppId={{8C4A7B9E-6B6E-4E4B-9D31-7A6F91C4E812}}

          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}

          DefaultDirName={localappdata}\Programs\amarPlayer
          DefaultGroupName=amarPlayer

          OutputDir=..\release
          OutputBaseFilename=amarPlayer-Setup-Windows-x64

          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          PrivilegesRequired=lowest

          Compression=lzma
          SolidCompression=yes

          Uninstallable=yes

          DisableProgramGroupPage=yes

          [Files]

          Source: "..\build\amarPlayer.dist\*";
          DestDir: "{app}";
          Flags: recursesubdirs ignoreversion

          [Icons]

          Name: "{autoprograms}\amarPlayer";
          Filename: "{app}\amarPlayer.exe";

          Name: "{autodesktop}\amarPlayer";
          Filename: "{app}\amarPlayer.exe";

          [Registry]

          Root: HKCU;
          Subkey: "Software\Classes\Applications\amarPlayer.exe";
          ValueType: string;
          ValueName: "FriendlyAppName";
          ValueData: "amarPlayer";
          Flags: uninsdeletekey

          Root: HKCU;
          Subkey: "Software\Classes\Applications\amarPlayer.exe\shell\open\command";
          ValueType: string;
          ValueName: "";
          ValueData: """{app}\amarPlayer.exe"" ""%1""";
          Flags: uninsdeletekey

          [Run]

          Filename: "{app}\amarPlayer.exe";
          Description: "Jalankan amarPlayer";
          Flags: nowait postinstall skipifsilent

          "@ |
          Set-Content `
            "installer\amarPlayer.iss" `
            -Encoding utf8


      # ============================================================
      # 22. BUILD WINDOWS INSTALLER
      # ============================================================

      - name: Build Windows installer
        shell: powershell
        run: |

          $iscc = `
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {

              Write-Error "ISCC.exe tidak ditemukan."

              exit 1
          }

          Write-Host "Inno Setup:"
          Write-Host $iscc

          & $iscc `
            "$env:GITHUB_WORKSPACE\installer\amarPlayer.iss"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Inno Setup gagal."

              exit $LASTEXITCODE
          }


      # ============================================================
      # 23. VERIFY INSTALLER
      # ============================================================

      - name: Verify installer
        shell: powershell
        run: |

          $installer = `
            "$env:GITHUB_WORKSPACE\release\amarPlayer-Setup-Windows-x64.exe"

          if (-not (Test-Path $installer)) {

              Write-Error "Installer Windows tidak ditemukan."

              Write-Host ""
              Write-Host "Isi release:"
              Get-ChildItem `
                "$env:GITHUB_WORKSPACE\release" `
                -Recurse `
                -ErrorAction SilentlyContinue

              exit 1
          }

          $size = `
            (Get-Item $installer).Length

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WINDOWS INSTALLER BERHASIL"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "File:"
          Write-Host $installer

          Write-Host ""
          Write-Host "Size:"
          Write-Host $size "bytes"


      # ============================================================
      # 24. COPY INSTALLER SOURCE
      # ============================================================

      - name: Prepare installer source files
        shell: powershell
        run: |

          Copy-Item `
            "installer\amarPlayer.iss" `
            "installer\amarPlayer.iss" `
            -Force


      # ============================================================
      # 25. SHOW FINAL RESULT
      # ============================================================

      - name: Show final build result
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "amarPlayer Windows BUILD SELESAI"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "RELEASE:"
          Get-ChildItem `
            "release" `
            -Recurse `
            -File |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "INSTALLER SOURCE:"
          Get-ChildItem `
            "installer" `
            -Recurse `
            -File |
            Select-Object FullName, Length


      # ============================================================
      # 26. UPLOAD WINDOWS INSTALLER
      # ============================================================

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64
          path: |
            release/amarPlayer-Setup-Windows-x64.exe
            installer/amarPlayer.iss
          if-no-files-found: error
          include-hidden-files: true


