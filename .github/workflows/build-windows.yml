name: Build amarPlayer Windows x64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install PySide6
          python -m pip install mutagen
          python -m pip install Pillow

      - name: Download GStreamer
        shell: powershell
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.7/msvc/gstreamer-1.0-msvc-x86_64-1.28.7.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\gstreamer.msi"

      - name: Install GStreamer
        shell: powershell
        run: |
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:RUNNER_TEMP\gstreamer.msi`" /qn /norestart" `
            -Wait

      - name: Build amarPlayer
        shell: powershell
        run: |
          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --follow-imports `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            --product-name="amarPlayer" `
            --file-description="Modern Music Player" `
            --company-name="Muammar" `
            amarPlayer.py

      - name: Locate GStreamer
        shell: powershell
        run: |
          $paths = @(
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          )

          $found = $false

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "GStreamer found: $path"
              "GST_ROOT=$path" >> $env:GITHUB_ENV
              $found = $true
              break
            }
          }

          if (-not $found) {
            Write-Error "GStreamer tidak ditemukan."
            exit 1
          }

      - name: Bundle GStreamer
        shell: powershell
        run: |
          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          New-Item -ItemType Directory -Force -Path "$app\gstreamer\bin"
          New-Item -ItemType Directory -Force -Path "$app\gstreamer\lib\gstreamer-1.0"

          Copy-Item "$env:GST_ROOT\bin\*.dll" `
            "$app\gstreamer\bin\" `
            -Force

          Copy-Item "$env:GST_ROOT\lib\gstreamer-1.0\*.dll" `
            "$app\gstreamer\lib\gstreamer-1.0\" `
            -Force

      - name: Copy icon
        shell: powershell
        run: |
          Copy-Item `
            "amarPlayer.png" `
            "build\amarPlayer.dist\amarPlayer.png" `
            -Force

      - name: Create launcher
        shell: powershell
        run: |
          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off
          set "HERE=%~dp0"
          set "PATH=%HERE%gstreamer\bin;%PATH%"
          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"
          set "GST_PLUGIN_SYSTEM_PATH_1_0="
          "%HERE%amarPlayer.exe" %*
          "@ | Set-Content "$app\amarPlayer.cmd"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Create installer script
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer

          @"
          #define MyAppName "amarPlayer"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Muammar"

          [Setup]
          AppId={{8C4A7B9E-6B6E-4E4B-9D31-AMARPLAYER}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\amarPlayer
          DefaultGroupName=amarPlayer
          OutputDir=release
          OutputBaseFilename=amarPlayer-Setup-Windows-x64
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          Compression=lzma
          SolidCompression=yes
          Uninstallable=yes

          [Files]
          Source: "..\build\amarPlayer.dist\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\amarPlayer"; Filename: "{app}\amarPlayer.exe"
          Name: "{autodesktop}\amarPlayer"; Filename: "{app}\amarPlayer.exe"

          [Registry]
          Root: HKCU; Subkey: "Software\Classes\Applications\amarPlayer.exe"; ValueType: string; ValueName: "FriendlyAppName"; ValueData: "amarPlayer"; Flags: uninsdeletekey
          Root: HKCU; Subkey: "Software\Classes\Applications\amarPlayer.exe\shell\open\command"; ValueType: string; ValueData: """{app}\amarPlayer.exe"" ""%1"""; Flags: uninsdeletekey

          [Run]
          Filename: "{app}\amarPlayer.exe"; Description: "Jalankan amarPlayer"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content installer\amarPlayer.iss -Encoding utf8

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "$env:GITHUB_WORKSPACE\installer\amarPlayer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64
          path: installer/release/amarPlayer-Setup-Windows-x64.exe
          if-no-files-found: error
