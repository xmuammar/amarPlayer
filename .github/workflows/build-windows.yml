name: Build amarPlayer Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"


      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install `
            nuitka `
            PySide6 `
            mutagen `
            Pillow `
            gstreamer-bundle==1.28.7


      - name: Verify Python GStreamer and amarPlayer
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Python"
          Write-Host "=========================================="

          python --version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PyGObject"
          Write-Host "=========================================="

          python -c "import gi; print('PyGObject OK')"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GStreamer"
          Write-Host "=========================================="

          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; Gst.init(None); print(Gst.version_string())"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "amarPlayer"
          Write-Host "=========================================="

          python -c "import amarPlayer; print('amarPlayer import OK')"


      - name: Locate Python site-packages
        shell: powershell
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"

          if (-not (Test-Path $site)) {
            Write-Error "Python site-packages tidak ditemukan."
            exit 1
          }

          Write-Host "Python site-packages:"
          Write-Host $site

          "PYTHON_SITE=$site" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      - name: Locate GStreamer bundle
        shell: powershell
        run: |
          $site = $env:PYTHON_SITE

          $possible = @(
            (Join-Path $site "gstreamer"),
            (Join-Path $site "gstreamer_bundle"),
            (Join-Path $site "gst")
          )

          $gst = $null

          foreach ($path in $possible) {
            if (Test-Path $path) {
              $gst = $path
              break
            }
          }

          if (-not $gst) {
            Write-Host "Isi Python site-packages:"
            Get-ChildItem $site | Select-Object Name

            Write-Error "GStreamer bundle tidak ditemukan."
            exit 1
          }

          Write-Host "GStreamer ditemukan:"
          Write-Host $gst

          "GSTREAMER_ROOT=$gst" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      - name: Build with Nuitka
        shell: powershell
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          [System.IO.Directory]::CreateDirectory("build") | Out-Null

          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --enable-plugin=gi `
            --follow-imports `
            --include-package=gi `
            --include-package-data=gi `
            --include-package=mutagen `
            --include-package=PIL `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            amarPlayer.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Nuitka build gagal."
            exit $LASTEXITCODE
          }


      - name: Verify Nuitka output
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $exe = Join-Path $app "amarPlayer.exe"

          if (-not (Test-Path $app)) {
            Write-Error "amarPlayer.dist tidak ditemukan."
            exit 1
          }

          if (-not (Test-Path $exe)) {
            Write-Error "amarPlayer.exe tidak ditemukan."
            exit 1
          }

          Write-Host "Nuitka build berhasil:"
          Write-Host $exe


      - name: Bundle GStreamer
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $source = $env:GSTREAMER_ROOT
          $target = Join-Path $app "gstreamer"

          if (-not (Test-Path $source)) {
            Write-Error "GStreamer source tidak ditemukan."
            exit 1
          }

          [System.IO.Directory]::CreateDirectory($target) | Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host "GStreamer berhasil dibundle."


      - name: Copy application icon
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $icon = Join-Path $env:GITHUB_WORKSPACE "amarPlayer.png"

          if (Test-Path $icon) {
            Copy-Item `
              -Path $icon `
              -Destination (Join-Path $app "amarPlayer.png") `
              -Force

            Write-Host "amarPlayer.png berhasil disalin."
          }
          else {
            Write-Warning "amarPlayer.png tidak ditemukan."
          }


      - name: Create launcher
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $launcher = Join-Path $app "amarPlayer.cmd"

          $content = @(
            '@echo off'
            'set "HERE=%~dp0"'
            ''
            'set "PYGI_DLL_DIRS=%HERE%gstreamer;%HERE%"'
            'set "PYGI_DLL_PATH=%HERE%gstreamer;%HERE%"'
            ''
            'set "PATH=%HERE%gstreamer\bin;%HERE%;%PATH%"'
            ''
            'set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"'
            'set "GST_PLUGIN_SYSTEM_PATH_1_0="'
            ''
            'set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"'
            ''
            '"%HERE%amarPlayer.exe" %*'
          )

          Set-Content `
            -Path $launcher `
            -Value $content `
            -Encoding ASCII

          Write-Host "Launcher dibuat:"
          Write-Host $launcher


      - name: Configure runtime environment
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $gst = Join-Path $app "gstreamer"

          $pygi = "$gst;$app"

          $gstPlugins = Join-Path `
            $gst `
            "lib\gstreamer-1.0"

          $typelib = Join-Path `
            $gst `
            "lib\girepository-1.0"

          "PYGI_DLL_DIRS=$pygi" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "PYGI_DLL_PATH=$pygi" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "GST_PLUGIN_PATH=$gstPlugins" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "GST_PLUGIN_SYSTEM_PATH_1_0=" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "GI_TYPELIB_PATH=$typelib" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "PATH=$gst\bin;$gst;$app;$env:PATH" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      - name: Verify bundled GStreamer
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $gst = Join-Path $app "gstreamer"

          if (-not (Test-Path $gst)) {
            Write-Error "Folder GStreamer tidak ditemukan."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "GStreamer DLL"
          Write-Host "=========================================="

          Get-ChildItem `
            $gst `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 30 FullName

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GStreamer plugins"
          Write-Host "=========================================="

          $plugins = Join-Path `
            $gst `
            "lib\gstreamer-1.0"

          if (Test-Path $plugins) {
            Get-ChildItem $plugins |
              Select-Object Name
          }


      - name: Test amarPlayer GUI runtime
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "build\amarPlayer.dist"
          $exe = Join-Path $app "amarPlayer.exe"
          $gst = Join-Path $app "gstreamer"

          $env:PYGI_DLL_DIRS = "$gst;$app"
          $env:PYGI_DLL_PATH = "$gst;$app"

          $env:PATH = `
            "$gst\bin;$gst;$app;$env:PATH"

          $env:GST_PLUGIN_PATH = `
            "$gst\lib\gstreamer-1.0"

          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = ""

          $env:GI_TYPELIB_PATH = `
            "$gst\lib\girepository-1.0"

          Write-Host "=========================================="
          Write-Host "Testing amarPlayer GUI runtime"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "PYGI_DLL_DIRS:"
          Write-Host $env:PYGI_DLL_DIRS

          Write-Host ""
          Write-Host "PYGI_DLL_PATH:"
          Write-Host $env:PYGI_DLL_PATH

          Write-Host ""
          Write-Host "GST_PLUGIN_PATH:"
          Write-Host $env:GST_PLUGIN_PATH

          Write-Host ""
          Write-Host "GI_TYPELIB_PATH:"
          Write-Host $env:GI_TYPELIB_PATH

          Write-Host ""
          Write-Host "Starting amarPlayer.exe..."

          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory $app `
            -PassThru

          $finished = $process.WaitForExit(10000)

          if (-not $finished) {
            Write-Host ""
            Write-Host "amarPlayer.exe masih berjalan setelah 10 detik."
            Write-Host "GUI application terdeteksi berjalan normal."

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "GUI runtime TEST PASSED."
          }
          else {
            Write-Host ""
            Write-Host "amarPlayer.exe berhenti."
            Write-Host "Exit code: $($process.ExitCode)"

            if ($process.ExitCode -ne 0) {
              Write-Error "GUI runtime gagal."
              exit 1
            }
          }


      - name: Find Inno Setup
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $iscc = $path
              break
            }
          }

          if (-not $iscc) {
            Write-Error "Inno Setup ISCC.exe tidak ditemukan."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "Inno Setup ditemukan"
          Write-Host "=========================================="

          Write-Host $iscc

          "ISCC_PATH=$iscc" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      - name: Prepare installer directories
        shell: powershell
        run: |
          $installerDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer"

          $releaseDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "release"

          [System.IO.Directory]::CreateDirectory(
            $installerDir
          ) | Out-Null

          [System.IO.Directory]::CreateDirectory(
            $releaseDir
          ) | Out-Null

          Write-Host "Installer directory:"
          Write-Host $installerDir

          Write-Host ""
          Write-Host "Release directory:"
          Write-Host $releaseDir


      - name: Create Inno Setup script
        shell: powershell
        run: |
          $installerDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer"

          $issPath = Join-Path `
            $installerDir `
            "amarPlayer.iss"

          $content = @(
            '#define MyAppName "amarPlayer"'
            '#define MyAppVersion "1.0.0"'
            '#define MyAppPublisher "Muammar"'
            '#define MyAppExeName "amarPlayer.exe"'
            ''
            '[Setup]'
            'AppId={{B7E7D0B7-0F57-4C0B-A8D1-8F3B8B5B6A01}'
            'AppName={#MyAppName}'
            'AppVersion={#MyAppVersion}'
            'AppPublisher={#MyAppPublisher}'
            'DefaultDirName={localappdata}\Programs\amarPlayer'
            'DefaultGroupName=amarPlayer'
            'PrivilegesRequired=lowest'
            'OutputDir=..\release'
            'OutputBaseFilename=amarPlayer-Setup-Windows-x64'
            'Compression=lzma'
            'SolidCompression=yes'
            'WizardStyle=modern'
            'UninstallDisplayIcon={app}\amarPlayer.exe'
            'ArchitecturesAllowed=x64compatible'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'DisableProgramGroupPage=yes'
            ''
            '[Files]'
            'Source: "..\build\amarPlayer.dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "Buat shortcut di Desktop"; GroupDescription: "Shortcut tambahan:"'
            ''
            '[Icons]'
            'Name: "{autoprograms}\amarPlayer"; Filename: "{app}\amarPlayer.exe"'
            'Name: "{autodesktop}\amarPlayer"; Filename: "{app}\amarPlayer.exe"; Tasks: desktopicon'
            ''
            '[Registry]'
            'Root: HKCU; Subkey: "Software\Classes\Applications\amarPlayer.exe"; ValueType: string; ValueName: "FriendlyAppName"; ValueData: "amarPlayer"; Flags: uninsdeletekey'
            'Root: HKCU; Subkey: "Software\Classes\Applications\amarPlayer.exe\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\amarPlayer.exe"" ""%1"""; Flags: uninsdeletevalue'
          )

          Set-Content `
            -Path $issPath `
            -Value $content `
            -Encoding UTF8

          if (-not (Test-Path $issPath)) {
            Write-Error "Gagal membuat amarPlayer.iss."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "Inno Setup script berhasil dibuat"
          Write-Host "=========================================="

          Write-Host $issPath


      - name: Build installer
        shell: powershell
        run: |
          $iss = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer\amarPlayer.iss"

          if (-not (Test-Path $iss)) {
            Write-Error "amarPlayer.iss tidak ditemukan."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "Building Windows installer"
          Write-Host "=========================================="

          & $env:ISCC_PATH "/Qp" $iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup gagal."
            exit $LASTEXITCODE
          }


      - name: Verify installer
        shell: powershell
        run: |
          $installer = Join-Path `
            $env:GITHUB_WORKSPACE `
            "release\amarPlayer-Setup-Windows-x64.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Installer tidak ditemukan."
            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BUILD WINDOWS x64 BERHASIL"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "File:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"


      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64
          path: release/amarPlayer-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
