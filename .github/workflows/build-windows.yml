
name: Build amarPlayer Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-windows:

    name: Build amarPlayer Windows x64

    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.12 X64
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: powershell
        run: |

          python -m pip install --upgrade pip

          python -m pip install `
            nuitka `
            PySide6 `
            mutagen `
            Pillow `
            gstreamer-bundle==1.28.7


      # ============================================================
      # 4. VERIFY PYTHON
      # ============================================================

      - name: Verify Python
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "Python"
          Write-Host "=========================================="

          python --version

          Write-Host ""

          python -c "import sys; print(sys.executable)"


      # ============================================================
      # 5. VERIFY PYGI
      # ============================================================

      - name: Verify PyGObject
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "PyGObject"
          Write-Host "=========================================="

          python -c "import gi; print('PyGObject OK:', gi.__file__)"


      # ============================================================
      # 6. VERIFY GSTREAMER
      # ============================================================

      - name: Verify GStreamer
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "GStreamer"
          Write-Host "=========================================="

          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; Gst.init(None); print('GStreamer OK:', Gst.version_string())"


      # ============================================================
      # 7. TEST APPLICATION IMPORT
      # ============================================================

      - name: Test amarPlayer import
        shell: powershell
        run: |

          python -c "import amarPlayer; print('amarPlayer import OK')"


      # ============================================================
      # 8. BUILD WITH NUITKA
      #
      # Tidak menggunakan metadata Windows version information.
      # ============================================================

      - name: Build amarPlayer with Nuitka
        shell: powershell
        run: |

          Remove-Item `
            -Recurse `
            -Force `
            build `
            -ErrorAction SilentlyContinue

          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --enable-plugin=gi `
            --follow-imports `
            --include-package=gi `
            --include-package-data=gi `
            --include-package=mutagen `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            amarPlayer.py


      # ============================================================
      # 9. VERIFY NUITKA OUTPUT
      # ============================================================

      - name: Verify Nuitka output
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          if (-not (Test-Path $app)) {

              Write-Error "Folder amarPlayer.dist tidak ditemukan."

              Get-ChildItem `
                "$env:GITHUB_WORKSPACE\build" `
                -Recurse `
                -ErrorAction SilentlyContinue

              exit 1
          }

          if (-not (Test-Path "$app\amarPlayer.exe")) {

              Write-Error "amarPlayer.exe tidak ditemukan."

              exit 1
          }

          Write-Host ""
          Write-Host "Nuitka build berhasil."
          Write-Host ""

          Get-Item "$app\amarPlayer.exe" |
            Select-Object FullName, Length


      # ============================================================
      # 10. LOCATE PYTHON SITE PACKAGES
      # ============================================================

      - name: Locate Python site packages
        shell: powershell
        run: |

          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"

          if (-not (Test-Path $site)) {

              Write-Error "Python site-packages tidak ditemukan."

              exit 1
          }

          "PYTHON_SITE=$site" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Python site-packages:"
          Write-Host $site


      # ============================================================
      # 11. INSPECT GSTREAMER FILES
      # ============================================================

      - name: Inspect GStreamer installation
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GStreamer installation"
          Write-Host "=========================================="
          Write-Host ""

          Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "gstreamer"
            } |
            Select-Object FullName


      # ============================================================
      # 12. PREPARE RUNTIME DIRECTORIES
      # ============================================================

      - name: Prepare runtime directories
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\gstreamer-1.0" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\girepository-1.0" |
            Out-Null

          Write-Host "Runtime directories created."


      # ============================================================
      # 13. COPY GSTREAMER / GLIB DLLS
      #
      # Kita tidak hanya mencari nama "gst".
      # Semua DLL yang relevan dengan GStreamer/PyGObject
      # dikumpulkan dari Python site-packages.
      # ============================================================

      - name: Bundle GStreamer and PyGObject DLLs
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $dllTarget = "$app\gstreamer"

          $dlls = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          if (-not $dlls) {

              Write-Error "Tidak ada DLL ditemukan."

              exit 1
          }

          $copied = 0

          foreach ($dll in $dlls) {

              $path = $dll.FullName.ToLower()

              if (
                  $path -match "gstreamer" -or
                  $path -match "\\gst" -or
                  $path -match "glib" -or
                  $path -match "gobject" -or
                  $path -match "gio" -or
                  $path -match "gmodule" -or
                  $path -match "ffi" -or
                  $path -match "pcre" -or
                  $path -match "intl" -or
                  $path -match "iconv"
              ) {

                  Write-Host "DLL:"
                  Write-Host $dll.FullName

                  Copy-Item `
                    $dll.FullName `
                    $dllTarget `
                    -Force

                  $copied++
              }
          }

          Write-Host ""
          Write-Host "DLL copied:"
          Write-Host $copied

          if ($copied -eq 0) {

              Write-Error "Tidak ada DLL GStreamer/PyGObject yang berhasil disalin."

              exit 1
          }


      # ============================================================
      # 14. COPY GSTREAMER PLUGINS
      # ============================================================

      - name: Bundle GStreamer plugins
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $pluginTarget = `
            "$app\gstreamer\lib\gstreamer-1.0"

          $plugins = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "gstreamer-1\.0"
            }

          if (-not $plugins) {

              Write-Warning `
                "Tidak ditemukan DLL pada path gstreamer-1.0."

          } else {

              $copied = 0

              foreach ($plugin in $plugins) {

                  Write-Host "GStreamer plugin:"
                  Write-Host $plugin.FullName

                  Copy-Item `
                    $plugin.FullName `
                    $pluginTarget `
                    -Force

                  $copied++
              }

              Write-Host ""
              Write-Host "Plugins copied:"
              Write-Host $copied
          }


      # ============================================================
      # 15. COPY GSTREAMER TYPELIBS
      # ============================================================

      - name: Bundle GObject typelibs
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $typeTarget = `
            "$app\gstreamer\lib\girepository-1.0"

          $typelibs = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -Filter "*.typelib" `
            -ErrorAction SilentlyContinue

          if (-not $typelibs) {

              Write-Warning `
                "Tidak ditemukan GObject typelibs."

          } else {

              $copied = 0

              foreach ($type in $typelibs) {

                  Write-Host "Typelib:"
                  Write-Host $type.FullName

                  Copy-Item `
                    $type.FullName `
                    $typeTarget `
                    -Force

                  $copied++
              }

              Write-Host ""
              Write-Host "Typelibs copied:"
              Write-Host $copied
          }


      # ============================================================
      # 16. COPY ICON
      # ============================================================

      - name: Copy amarPlayer icon
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          if (-not (Test-Path "amarPlayer.png")) {

              Write-Error "amarPlayer.png tidak ditemukan."

              exit 1
          }

          Copy-Item `
            "amarPlayer.png" `
            "$app\amarPlayer.png" `
            -Force


      # ============================================================
      # 17. CREATE WINDOWS LAUNCHER
      # ============================================================

      - name: Create amarPlayer launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "PYGI_DLL_DIRS=%HERE%gstreamer;%HERE%"
          set "PYGI_DLL_PATH=%HERE%gstreamer;%HERE%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"

          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe" %*
          "@ |
          Set-Content `
            "$app\amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # 18. CREATE TEST LAUNCHER
      # ============================================================

      - name: Create test launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "PYGI_DLL_DIRS=%HERE%gstreamer;%HERE%"
          set "PYGI_DLL_PATH=%HERE%gstreamer;%HERE%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"

          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe"
          "@ |
          Set-Content `
            "$app\test-amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # 19. TEST COMPILED APPLICATION
      #
      # PENTING:
      # Environment variables di-set SEBELUM executable dijalankan.
      # ============================================================

      - name: Test compiled amarPlayer
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $gst = "$app\gstreamer"

          $plugins = `
            "$gst\lib\gstreamer-1.0"

          $typelibs = `
            "$gst\lib\girepository-1.0"

          # --------------------------------------------------------
          # DLL SEARCH
          # --------------------------------------------------------

          $env:PATH = `
            "$gst;$app;$env:PATH"

          # --------------------------------------------------------
          # PyGObject DLL SEARCH
          #
          # Kita set kedua nama variabel karena versi PyGObject
          # yang berbeda dapat menggunakan nama yang berbeda.
          # --------------------------------------------------------

          $env:PYGI_DLL_DIRS = `
            "$gst;$app"

          $env:PYGI_DLL_PATH = `
            "$gst;$app"

          # --------------------------------------------------------
          # GStreamer
          # --------------------------------------------------------

          $env:GST_PLUGIN_PATH = `
            $plugins

          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = ""

          # --------------------------------------------------------
          # GObject Introspection
          # --------------------------------------------------------

          $env:GI_TYPELIB_PATH = `
            $typelibs

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Runtime environment"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "APP:"
          Write-Host $app

          Write-Host ""
          Write-Host "PATH:"
          Write-Host $env:PATH

          Write-Host ""
          Write-Host "PYGI_DLL_DIRS:"
          Write-Host $env:PYGI_DLL_DIRS

          Write-Host ""
          Write-Host "PYGI_DLL_PATH:"
          Write-Host $env:PYGI_DLL_PATH

          Write-Host ""
          Write-Host "GST_PLUGIN_PATH:"
          Write-Host $env:GST_PLUGIN_PATH

          Write-Host ""
          Write-Host "GI_TYPELIB_PATH:"
          Write-Host $env:GI_TYPELIB_PATH

          # --------------------------------------------------------
          # CHECK DIRECTORIES
          # --------------------------------------------------------

          if (-not (Test-Path $gst)) {

              Write-Error "Folder GStreamer tidak ditemukan."

              exit 1
          }

          if (-not (Test-Path $plugins)) {

              Write-Error "Folder GStreamer plugin tidak ditemukan."

              exit 1
          }

          if (-not (Test-Path $typelibs)) {

              Write-Error "Folder typelib tidak ditemukan."

              exit 1
          }

          # --------------------------------------------------------
          # CHECK IMPORTANT DLL
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "GStreamer DLL:"
          Get-ChildItem `
            $gst `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length

          # --------------------------------------------------------
          # RUN APPLICATION
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Testing amarPlayer.exe"
          Write-Host "=========================================="
          Write-Host ""

          & "$app\amarPlayer.exe" --help

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Exit code:"
          Write-Host $exitCode

          if ($exitCode -ne 0) {

              Write-Error `
                "amarPlayer.exe gagal dijalankan."

              exit $exitCode
          }

          Write-Host ""
          Write-Host "amarPlayer.exe TEST PASSED."


      # ============================================================
      # 20. INSTALL INNO SETUP
      # ============================================================

      - name: Install Inno Setup
        shell: powershell
        run: |

          choco install innosetup `
            --yes `
            --no-progress


      # ============================================================
      # 21. PREPARE INSTALLER DIRECTORIES
      # ============================================================

      - name: Prepare installer directories
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path installer |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path release |
            Out-Null


      # ============================================================
      # 22. CREATE INNO SETUP SCRIPT
      # ============================================================

      - name: Create Inno Setup script
        shell: powershell
        run: |

          @"
          #define MyAppName "amarPlayer"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Muammar"
          #define MyAppExeName "amarPlayer.exe"

          [Setup]

          AppId={{8C4A7B9E-6B6E-4E4B-9D31-7A6F91C4E812}}

          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}

          DefaultDirName={localappdata}\Programs\amarPlayer
          DefaultGroupName=amarPlayer

          OutputDir=..\release
          OutputBaseFilename=amarPlayer-Setup-Windows-x64

          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          PrivilegesRequired=lowest

          Compression=lzma
          SolidCompression=yes

          Uninstallable=yes

          DisableProgramGroupPage=yes

          [Files]

          Source: "..\build\amarPlayer.dist\*";
          DestDir: "{app}";
          Flags: recursesubdirs ignoreversion

          [Icons]

          Name: "{autoprograms}\amarPlayer";
          Filename: "{app}\amarPlayer.exe"

          Name: "{autodesktop}\amarPlayer";
          Filename: "{app}\amarPlayer.exe"

          [Registry]

          Root: HKCU;
          Subkey: "Software\Classes\Applications\amarPlayer.exe";
          ValueType: string;
          ValueName: "FriendlyAppName";
          ValueData: "amarPlayer";
          Flags: uninsdeletekey

          Root: HKCU;
          Subkey: "Software\Classes\Applications\amarPlayer.exe\shell\open\command";
          ValueType: string;
          ValueName: "";
          ValueData: """{app}\amarPlayer.exe"" ""%1""";
          Flags: uninsdeletekey

          [Run]

          Filename: "{app}\amarPlayer.exe";
          Description: "Jalankan amarPlayer";
          Flags: nowait postinstall skipifsilent
          "@ |
          Set-Content `
            "installer\amarPlayer.iss" `
            -Encoding utf8


      # ============================================================
      # 23. BUILD WINDOWS INSTALLER
      # ============================================================

      - name: Build Windows installer
        shell: powershell
        run: |

          $iscc = `
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {

              Write-Error "ISCC.exe tidak ditemukan."

              exit 1
          }

          & $iscc `
            "$env:GITHUB_WORKSPACE\installer\amarPlayer.iss"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Inno Setup gagal."

              exit $LASTEXITCODE
          }


      # ============================================================
      # 24. VERIFY INSTALLER
      # ============================================================

      - name: Verify Windows installer
        shell: powershell
        run: |

          $installer = `
            "$env:GITHUB_WORKSPACE\release\amarPlayer-Setup-Windows-x64.exe"

          if (-not (Test-Path $installer)) {

              Write-Error "Windows installer tidak ditemukan."

              Get-ChildItem `
                "$env:GITHUB_WORKSPACE\release" `
                -Recurse `
                -ErrorAction SilentlyContinue

              exit 1
          }

          $size = `
            (Get-Item $installer).Length

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WINDOWS INSTALLER BERHASIL"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "File:"
          Write-Host $installer

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$size bytes"


      # ============================================================
      # 25. SHOW FINAL BUILD
      # ============================================================

      - name: Show final build
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "amarPlayer Windows BUILD SELESAI"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "RELEASE:"
          Get-ChildItem `
            "release" `
            -Recurse `
            -File |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "INSTALLER SOURCE:"
          Get-ChildItem `
            "installer" `
            -Recurse `
            -File |
            Select-Object FullName, Length


      # ============================================================
      # 26. UPLOAD WINDOWS ARTIFACT
      # ============================================================

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64
          path: |
            release/amarPlayer-Setup-Windows-x64.exe
            installer/amarPlayer.iss
          if-no-files-found: error
          include-hidden-files: true


