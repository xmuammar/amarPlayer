name: Build amarPlayer Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build amarPlayer Windows x64
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64


      # ============================================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            nuitka `
            PySide6 `
            mutagen `
            Pillow `
            gstreamer-bundle==1.28.7


      # ============================================================
      # 4. VERIFY PYTHON + GSTREAMER
      # ============================================================
      - name: Verify GStreamer Python bindings
        shell: powershell
        run: |
          python -c "import gi; print('PyGObject OK:', gi.__file__)"
          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; Gst.init(None); print('GStreamer OK:', Gst.version_string())"


      # ============================================================
      # 5. TEST amarPlayer IMPORT
      # ============================================================
      - name: Test amarPlayer imports
        shell: powershell
        run: |
          python -c "import amarPlayer; print('amarPlayer import OK')"


      # ============================================================
      # 6. BUILD WITH NUITKA
      # ============================================================
      - name: Build amarPlayer with Nuitka
        shell: powershell
        run: |

          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --enable-plugin=gi `
            --follow-imports `
            --include-package=gi `
            --include-package-data=gi `
            --include-package=mutagen `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            --product-name="amarPlayer" `
            --file-description="Modern Music Player" `
            --company-name="Muammar" `
            --file-version="1.0.0.0" `
            --product-version="1.0.0" `
            amarPlayer.py


      # ============================================================
      # 7. LOCATE PYTHON SITE-PACKAGES
      # ============================================================
      - name: Locate Python packages
        shell: powershell
        run: |

          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"

          if (-not (Test-Path $site)) {
              Write-Error "Python site-packages tidak ditemukan."
              exit 1
          }

          "PYTHON_SITE=$site" >> $env:GITHUB_ENV

          Write-Host "Python site-packages:"
          Write-Host $site


      # ============================================================
      # 8. INSPECT GSTREAMER
      # ============================================================
      - name: Inspect GStreamer installation
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "GStreamer related files"
          Write-Host "=========================================="

          Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "gstreamer|gst|glib|gobject|gio|ffi"
            } |
            Select-Object FullName


      # ============================================================
      # 9. PREPARE APPLICATION DIRECTORY
      # ============================================================
      - name: Prepare application directory
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          if (-not (Test-Path $app)) {
              Write-Error "amarPlayer.dist tidak ditemukan."
              exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer" |
            Out-Null


      # ============================================================
      # 10. BUNDLE GSTREAMER DLL
      # ============================================================
      - name: Bundle GStreamer runtime
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          Write-Host "Mencari DLL GStreamer..."

          $dlls = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          if (-not $dlls) {
              Write-Error "Tidak ada DLL ditemukan."
              exit 1
          }

          foreach ($dll in $dlls) {

              $name = $dll.Name.ToLower()

              if (
                  $name -match "^libgst" -or
                  $name -match "^gstreamer" -or
                  $name -match "^gst" -or
                  $name -match "^glib" -or
                  $name -match "^gobject" -or
                  $name -match "^gio" -or
                  $name -match "^gmodule" -or
                  $name -match "^ffi"
              ) {

                  Write-Host "Copy DLL: $($dll.FullName)"

                  Copy-Item `
                    $dll.FullName `
                    "$app\gstreamer\" `
                    -Force
              }
          }


      # ============================================================
      # 11. BUNDLE GSTREAMER PLUGINS
      # ============================================================
      - name: Bundle GStreamer plugins
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\gstreamer-1.0" |
            Out-Null

          $plugins = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          foreach ($plugin in $plugins) {

              $name = $plugin.Name.ToLower()

              if (
                  $name -match "gst.*\.dll" -or
                  $name -match "gstreamer.*\.dll"
              ) {

                  Write-Host "Plugin: $($plugin.FullName)"

                  Copy-Item `
                    $plugin.FullName `
                    "$app\gstreamer\lib\gstreamer-1.0\" `
                    -Force
              }
          }


      # ============================================================
      # 12. BUNDLE GOBJECT INTROSPECTION
      # ============================================================
      - name: Bundle GObject Introspection data
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\girepository-1.0" |
            Out-Null

          $typelibs = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -Filter "*.typelib" `
            -ErrorAction SilentlyContinue

          if ($typelibs) {

              foreach ($type in $typelibs) {

                  Write-Host "Typelib: $($type.FullName)"

                  Copy-Item `
                    $type.FullName `
                    "$app\gstreamer\lib\girepository-1.0\" `
                    -Force
              }

          } else {

              Write-Warning "Tidak ditemukan typelib."

          }


      # ============================================================
      # 13. COPY ICON
      # ============================================================
      - name: Copy amarPlayer icon
        shell: powershell
        run: |

          Copy-Item `
            "amarPlayer.png" `
            "build\amarPlayer.dist\amarPlayer.png" `
            -Force


      # ============================================================
      # 14. CREATE WINDOWS LAUNCHER
      # ============================================================
      - name: Create amarPlayer launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"

          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe" %*
          "@ |
          Set-Content `
            "$app\amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # 15. TEST SCRIPT
      # ============================================================
      - name: Create GStreamer test launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"

          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe"
          "@ |
          Set-Content `
            "$app\test-amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # 16. TEST COMPILED APPLICATION
      # ============================================================
      - name: Test compiled amarPlayer
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $env:PATH = "$app\gstreamer;$app;$env:PATH"

          $env:GST_PLUGIN_PATH = `
            "$app\gstreamer\lib\gstreamer-1.0"

          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = ""

          $env:GI_TYPELIB_PATH = `
            "$app\gstreamer\lib\girepository-1.0"

          Write-Host "Testing amarPlayer..."

          & "$app\amarPlayer.exe" --help

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "amarPlayer returned exit code $LASTEXITCODE."
          }


      # ============================================================
      # 17. INSTALL INNO SETUP
      # ============================================================
      - name: Install Inno Setup
        shell: powershell
        run: |

          choco install innosetup `
            --yes `
            --no-progress


      # ============================================================
      # 18. CREATE INNO SETUP SCRIPT
      # ============================================================
      - name: Create Inno Setup script
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path installer |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path release |
            Out-Null

          @"
          #define MyAppName "amarPlayer"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Muammar"
          #define MyAppExeName "amarPlayer.exe"

          [Setup]
          AppId={{8C4A7B9E-6B6E-4E4B-9D31-7A6F91C4E812}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}

          DefaultDirName={autopf}\amarPlayer
          DefaultGroupName=amarPlayer

          OutputDir=release
          OutputBaseFilename=amarPlayer-Setup-Windows-x64

          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64

          PrivilegesRequired=lowest

          Compression=lzma
          SolidCompression=yes

          Uninstallable=yes
          DisableProgramGroupPage=yes

          [Files]

          Source: "..\build\amarPlayer.dist\*";
          DestDir: "{app}";
          Flags: recursesubdirs ignoreversion

          [Icons]

          Name: "{autoprograms}\amarPlayer";
          Filename: "{app}\amarPlayer.exe"

          Name: "{autodesktop}\amarPlayer";
          Filename: "{app}\amarPlayer.exe"

          [Registry]

          Root: HKCU;
          Subkey: "Software\Classes\Applications\amarPlayer.exe";
          ValueType: string;
          ValueName: "FriendlyAppName";
          ValueData: "amarPlayer";
          Flags: uninsdeletekey

          Root: HKCU;
          Subkey: "Software\Classes\Applications\amarPlayer.exe\shell\open\command";
          ValueType: string;
          ValueName: "";
          ValueData: """{app}\amarPlayer.exe"" ""%1""";
          Flags: uninsdeletekey

          [Run]

          Filename: "{app}\amarPlayer.exe";
          Description: "Jalankan amarPlayer";
          Flags: nowait postinstall skipifsilent
          "@ |
          Set-Content `
            "installer\amarPlayer.iss" `
            -Encoding utf8


      # ============================================================
      # 19. BUILD INSTALLER
      # ============================================================
      - name: Build Windows installer
        shell: powershell
        run: |

          $iscc = `
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {

              Write-Error "ISCC.exe tidak ditemukan."
              exit 1
          }

          & $iscc `
            "$env:GITHUB_WORKSPACE\installer\amarPlayer.iss"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Inno Setup gagal."
              exit $LASTEXITCODE
          }


      # ============================================================
      # 20. SHOW RESULT
      # ============================================================
      - name: Show build result
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "amarPlayer Windows build selesai"
          Write-Host "=========================================="
          Write-Host ""

          Get-ChildItem `
            "release" `
            -Recurse `
            -File |
            Select-Object FullName, Length


      # ============================================================
      # 21. UPLOAD INSTALLER
      # ============================================================
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64
          path: release/amarPlayer-Setup-Windows-x64.exe
          if-no-files-found: error
