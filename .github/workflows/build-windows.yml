name: Build amarPlayer Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-windows:

    name: Build amarPlayer Windows x64

    runs-on: windows-2022

    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64


      - name: Verify Python
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Python"
          Write-Host "=========================================="

          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import platform; print(platform.platform())"
          python -c "import struct; print('Python bits:', struct.calcsize('P') * 8)"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            nuitka `
            PySide6 `
            mutagen `
            Pillow `
            gstreamer-bundle==1.28.7


      # ============================================================
      # VERIFY PYGI
      # ============================================================

      - name: Verify PyGObject
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "PyGObject"
          Write-Host "=========================================="

          python -c "import gi; print('PyGObject OK:', gi.__file__)"


      # ============================================================
      # VERIFY GSTREAMER
      # ============================================================

      - name: Verify GStreamer
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "GStreamer"
          Write-Host "=========================================="

          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; Gst.init(None); print('GStreamer OK:', Gst.version_string())"


      # ============================================================
      # VERIFY APPLICATION IMPORT
      # ============================================================

      - name: Test amarPlayer import
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "amarPlayer Python import"
          Write-Host "=========================================="

          python -c "import amarPlayer; print('amarPlayer import OK')"


      # ============================================================
      # NUITKA BUILD
      # ============================================================

      - name: Build amarPlayer with Nuitka
        shell: powershell
        run: |

          Remove-Item `
            -Recurse `
            -Force `
            build `
            -ErrorAction SilentlyContinue

          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --enable-plugin=gi `
            --follow-imports `
            --include-package=gi `
            --include-package-data=gi `
            --include-package=mutagen `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            amarPlayer.py


      # ============================================================
      # VERIFY NUITKA OUTPUT
      # ============================================================

      - name: Verify Nuitka output
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          Write-Host "=========================================="
          Write-Host "Nuitka output"
          Write-Host "=========================================="

          if (-not (Test-Path $app)) {
              Write-Error "Folder amarPlayer.dist tidak ditemukan."
              Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Recurse -ErrorAction SilentlyContinue
              exit 1
          }

          if (-not (Test-Path "$app\amarPlayer.exe")) {
              Write-Error "amarPlayer.exe tidak ditemukan."
              exit 1
          }

          Write-Host ""
          Write-Host "Nuitka build berhasil."

          Get-Item "$app\amarPlayer.exe" |
            Select-Object FullName, Length


      # ============================================================
      # LOCATE PYTHON SITE-PACKAGES
      # ============================================================

      - name: Locate Python site packages
        shell: powershell
        run: |

          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"

          if (-not (Test-Path $site)) {
              Write-Error "Python site-packages tidak ditemukan."
              exit 1
          }

          "PYTHON_SITE=$site" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Python site-packages:"
          Write-Host $site


      # ============================================================
      # INSPECT GSTREAMER
      # ============================================================

      - name: Inspect GStreamer installation
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "GStreamer installation"
          Write-Host "=========================================="

          Get-ChildItem "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "gstreamer" -or
              $_.FullName -match "girepository" -or
              $_.FullName -match "typelib"
            } |
            Select-Object FullName


      # ============================================================
      # CREATE RUNTIME DIRECTORIES
      # ============================================================

      - name: Prepare runtime directories
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\gstreamer-1.0" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$app\gstreamer\lib\girepository-1.0" |
            Out-Null

          Write-Host "Runtime directories created."


      # ============================================================
      # COPY DLL
      # ============================================================

      - name: Bundle GStreamer and PyGObject DLLs
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"
          $dllTarget = "$app\gstreamer"

          $dlls = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          if (-not $dlls) {
              Write-Error "Tidak ada DLL ditemukan."
              exit 1
          }

          $copied = 0

          foreach ($dll in $dlls) {

              $path = $dll.FullName.ToLower()

              if (
                  $path -match "gstreamer" -or
                  $path -match "\\gst" -or
                  $path -match "glib" -or
                  $path -match "gobject" -or
                  $path -match "gio" -or
                  $path -match "gmodule" -or
                  $path -match "ffi" -or
                  $path -match "pcre" -or
                  $path -match "intl" -or
                  $path -match "iconv" -or
                  $path -match "orc"
              ) {

                  Write-Host "DLL:"
                  Write-Host $dll.FullName

                  Copy-Item `
                    $dll.FullName `
                    $dllTarget `
                    -Force

                  $copied++
              }
          }

          Write-Host ""
          Write-Host "DLL copied:"
          Write-Host $copied

          if ($copied -eq 0) {
              Write-Error "Tidak ada DLL GStreamer/PyGObject yang berhasil disalin."
              exit 1
          }


      # ============================================================
      # COPY GSTREAMER PLUGINS
      # ============================================================

      - name: Bundle GStreamer plugins
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $pluginTarget =
            "$app\gstreamer\lib\gstreamer-1.0"

          $plugins = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "gstreamer-1\.0"
            }

          if (-not $plugins) {

              Write-Error `
                "Tidak ditemukan GStreamer plugin DLL."

              exit 1
          }

          $copied = 0

          foreach ($plugin in $plugins) {

              Write-Host "GStreamer plugin:"
              Write-Host $plugin.FullName

              Copy-Item `
                $plugin.FullName `
                $pluginTarget `
                -Force

              $copied++
          }

          Write-Host ""
          Write-Host "Plugins copied:"
          Write-Host $copied


      # ============================================================
      # COPY TYPELIBS
      # ============================================================

      - name: Bundle GObject typelibs
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $typeTarget =
            "$app\gstreamer\lib\girepository-1.0"

          $typelibs = Get-ChildItem `
            "$env:PYTHON_SITE" `
            -Recurse `
            -File `
            -Filter "*.typelib" `
            -ErrorAction SilentlyContinue

          if (-not $typelibs) {

              Write-Error `
                "Tidak ditemukan GObject typelibs."

              exit 1
          }

          $copied = 0

          foreach ($type in $typelibs) {

              Write-Host "Typelib:"
              Write-Host $type.FullName

              Copy-Item `
                $type.FullName `
                $typeTarget `
                -Force

              $copied++
          }

          Write-Host ""
          Write-Host "Typelibs copied:"
          Write-Host $copied


      # ============================================================
      # COPY ICON
      # ============================================================

      - name: Copy amarPlayer icon
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          if (-not (Test-Path "amarPlayer.png")) {

              Write-Error `
                "amarPlayer.png tidak ditemukan."

              exit 1
          }

          Copy-Item `
            "amarPlayer.png" `
            "$app\amarPlayer.png" `
            -Force


      # ============================================================
      # CREATE WINDOWS LAUNCHER
      # ============================================================

      - name: Create amarPlayer launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "PYGI_DLL_DIRS=%HERE%gstreamer;%HERE%"
          set "PYGI_DLL_PATH=%HERE%gstreamer;%HERE%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"
          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe" %*
          "@ |
          Set-Content `
            "$app\amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # CREATE TEST LAUNCHER
      # ============================================================

      - name: Create test launcher
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          @"
          @echo off

          set "HERE=%~dp0"

          set "PATH=%HERE%gstreamer;%HERE%;%PATH%"

          set "PYGI_DLL_DIRS=%HERE%gstreamer;%HERE%"
          set "PYGI_DLL_PATH=%HERE%gstreamer;%HERE%"

          set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"
          set "GST_PLUGIN_SYSTEM_PATH_1_0="

          set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"

          "%HERE%amarPlayer.exe"
          "@ |
          Set-Content `
            "$app\test-amarPlayer.cmd" `
            -Encoding ascii


      # ============================================================
      # VERIFY RUNTIME FILES
      # ============================================================

      - name: Verify bundled runtime
        shell: powershell
        run: |

          $app = "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $gst =
            "$app\gstreamer"

          $plugins =
            "$gst\lib\gstreamer-1.0"

          $typelibs =
            "$gst\lib\girepository-1.0"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Bundled runtime validation"
          Write-Host "=========================================="

          if (-not (Test-Path "$app\amarPlayer.exe")) {
              Write-Error "amarPlayer.exe tidak ditemukan."
              exit 1
          }

          if (-not (Test-Path $gst)) {
              Write-Error "Folder GStreamer tidak ditemukan."
              exit 1
          }

          if (-not (Test-Path $plugins)) {
              Write-Error "Folder GStreamer plugin tidak ditemukan."
              exit 1
          }

          if (-not (Test-Path $typelibs)) {
              Write-Error "Folder GObject typelib tidak ditemukan."
              exit 1
          }

          $dlls =
            Get-ChildItem `
              $gst `
              -Filter "*.dll" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $dlls) {
              Write-Error "Tidak ada DLL GStreamer ditemukan."
              exit 1
          }

          $pluginFiles =
            Get-ChildItem `
              $plugins `
              -Filter "*.dll" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $pluginFiles) {
              Write-Error "Tidak ada GStreamer plugin ditemukan."
              exit 1
          }

          $typeFiles =
            Get-ChildItem `
              $typelibs `
              -Filter "*.typelib" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $typeFiles) {
              Write-Error "Tidak ada GObject typelib ditemukan."
              exit 1
          }

          Write-Host ""
          Write-Host "Executable:"
          Get-Item "$app\amarPlayer.exe" |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "GStreamer DLL:"
          $dlls |
            Select-Object Name, Length

          Write-Host ""
          Write-Host "GStreamer plugins:"
          $pluginFiles |
            Select-Object Name, Length

          Write-Host ""
          Write-Host "GObject typelibs:"
          $typeFiles |
            Select-Object Name, Length

          Write-Host ""
          Write-Host "Runtime files OK."


      # ============================================================
      # TEST GUI APPLICATION
      # MAXIMUM 10 SECONDS
      # ============================================================

      - name: Test amarPlayer runtime
        shell: powershell
        run: |

          $app =
            "$env:GITHUB_WORKSPACE\build\amarPlayer.dist"

          $gst =
            "$app\gstreamer"

          $plugins =
            "$gst\lib\gstreamer-1.0"

          $typelibs =
            "$gst\lib\girepository-1.0"

          $env:PATH =
            "$gst;$app;$env:PATH"

          $env:PYGI_DLL_DIRS =
            "$gst;$app"

          $env:PYGI_DLL_PATH =
            "$gst;$app"

          $env:GST_PLUGIN_PATH =
            $plugins

          $env:GST_PLUGIN_SYSTEM_PATH_1_0 =
            ""

          $env:GI_TYPELIB_PATH =
            $typelibs

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Testing amarPlayer GUI runtime"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "PYGI_DLL_DIRS:"
          Write-Host $env:PYGI_DLL_DIRS

          Write-Host ""
          Write-Host "PYGI_DLL_PATH:"
          Write-Host $env:PYGI_DLL_PATH

          Write-Host ""
          Write-Host "GST_PLUGIN_PATH:"
          Write-Host $env:GST_PLUGIN_PATH

          Write-Host ""
          Write-Host "GI_TYPELIB_PATH:"
          Write-Host $env:GI_TYPELIB_PATH

          Write-Host ""
          Write-Host "Starting amarPlayer.exe..."

          $process =
            Start-Process `
              -FilePath "$app\amarPlayer.exe" `
              -WorkingDirectory $app `
              -PassThru

          $finished =
            $process.WaitForExit(10000)

          if (-not $finished) {

              Write-Host ""
              Write-Host "amarPlayer.exe masih berjalan setelah 10 detik."
              Write-Host "GUI application terdeteksi berjalan normal."
              Write-Host "Menghentikan proses agar CI/CD dapat dilanjutkan."

              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "GUI runtime TEST PASSED."

          } else {

              Write-Host ""
              Write-Host "amarPlayer.exe berhenti sendiri."

              Write-Host "Exit code:"
              Write-Host $process.ExitCode

              if ($process.ExitCode -ne 0) {

                  Write-Error `
                    "amarPlayer.exe berhenti dengan exit code $($process.ExitCode)."

                  exit $process.ExitCode
              }

              Write-Host ""
              Write-Host "Runtime TEST PASSED."
          }


      # ============================================================
      # INSTALL INNO SETUP
      # ============================================================

      - name: Install Inno Setup
        shell: powershell
        run: |

          choco install innosetup `
            --yes `
            --no-progress


      # ============================================================
      # PREPARE INSTALLER
      # ============================================================

      - name: Prepare installer directories
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path installer |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Pat
