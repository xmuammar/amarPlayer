name: Build amarPlayer Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON 3.12 x64
      # ============================================================

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip


      # ============================================================
      # PYTHON INFORMATION
      # ============================================================

      - name: Check Python
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Python information"
          Write-Host "=========================================="

          python --version
          python -c "import platform; print(platform.platform())"
          python -c "import struct; print('Python bits:', struct.calcsize('P') * 8)"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install `
            nuitka `
            PySide6 `
            mutagen `
            Pillow `
            "gstreamer-bundle==1.28.7"


      # ============================================================
      # VERIFY PYTHON MODULES
      # ============================================================

      - name: Verify Python modules
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Verify Python modules"
          Write-Host "=========================================="

          python -c "import PySide6; print('PySide6 OK:', PySide6.__version__)"
          python -c "import mutagen; print('Mutagen OK')"
          python -c "import PIL; print('Pillow OK')"

          python -c "import gi; print('PyGObject OK')"

          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; Gst.init(None); print('GStreamer Python OK:', Gst.version_string())"


      # ============================================================
      # LOCATE GSTREAMER
      # ============================================================

      - name: Locate GStreamer installation
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Locate GStreamer"
          Write-Host "=========================================="

          $python = (Get-Command python).Source

          Write-Host "Python:"
          Write-Host $python

          $site = python -c "import site; print(site.getsitepackages()[0])"

          Write-Host ""
          Write-Host "Python site-packages:"
          Write-Host $site

          Write-Host ""
          Write-Host "GStreamer related packages:"

          Get-ChildItem $site -Directory |
            Where-Object {
              $_.Name -match "gstreamer|gi|pygobject"
            } |
            Select-Object FullName


      # ============================================================
      # BUILD DIRECTORY
      # ============================================================

      - name: Prepare build directory
        shell: powershell
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item installer -Recurse -Force -ErrorAction SilentlyContinue

          [System.IO.Directory]::CreateDirectory(
            (Join-Path $env:GITHUB_WORKSPACE "build")
          )

          [System.IO.Directory]::CreateDirectory(
            (Join-Path $env:GITHUB_WORKSPACE "release")
          )

          [System.IO.Directory]::CreateDirectory(
            (Join-Path $env:GITHUB_WORKSPACE "installer")
          )


      # ============================================================
      # COMPILE NUITKA
      # ============================================================

      - name: Build amarPlayer with Nuitka
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Nuitka build"
          Write-Host "=========================================="

          python -m nuitka `
            --mode=standalone `
            --enable-plugin=pyside6 `
            --enable-plugin=gi `
            --follow-imports `
            --include-package=gi `
            --include-package-data=gi `
            --include-package=mutagen `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --force-stdout-spec="{PROGRAM_BASE}.out.txt" `
            --force-stderr-spec="{PROGRAM_BASE}.err.txt" `
            --windows-icon-from-ico=amarPlayer.png `
            --output-dir=build `
            --output-filename=amarPlayer.exe `
            amarPlayer.py


      # ============================================================
      # FIND GSTREAMER PACKAGE
      # ============================================================

      - name: Find GStreamer files
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Find GStreamer files"
          Write-Host "=========================================="

          $site = python -c "import site; print(site.getsitepackages()[0])"

          Write-Host "Searching:"
          Write-Host $site

          Get-ChildItem $site -Recurse -File |
            Where-Object {
              $_.Name -match `
              "gstreamer.*\.dll|gst.*\.dll|libgst.*\.dll|girepository.*\.dll"
            } |
            Select-Object FullName, Length


      # ============================================================
      # CREATE GSTREAMER DIRECTORY
      # ============================================================

      - name: Prepare GStreamer runtime
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          $gst = Join-Path $app "gstreamer"

          [System.IO.Directory]::CreateDirectory($gst)
          [System.IO.Directory]::CreateDirectory(
            (Join-Path $gst "bin")
          )
          [System.IO.Directory]::CreateDirectory(
            (Join-Path $gst "lib")
          )
          [System.IO.Directory]::CreateDirectory(
            (Join-Path $gst "lib\gstreamer-1.0")
          )
          [System.IO.Directory]::CreateDirectory(
            (Join-Path $gst "lib\girepository-1.0")
          )

          Write-Host "GStreamer directory:"
          Write-Host $gst


      # ============================================================
      # COPY GSTREAMER DLL
      # ============================================================

      - name: Copy GStreamer DLL
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          $gst = Join-Path $app "gstreamer"

          $site = python -c "import site; print(site.getsitepackages()[0])"

          Write-Host "=========================================="
          Write-Host "GStreamer DLL"
          Write-Host "=========================================="

          $dlls = Get-ChildItem `
            $site `
            -Recurse `
            -File `
            -Filter "*.dll"

          foreach ($dll in $dlls) {

            if (
              $dll.Name -match "^gstreamer.*\.dll$" -or
              $dll.Name -match "^gst.*\.dll$" -or
              $dll.Name -match "^libgst.*\.dll$" -or
              $dll.Name -match "^libglib.*\.dll$" -or
              $dll.Name -match "^libgobject.*\.dll$" -or
              $dll.Name -match "^libgmodule.*\.dll$" -or
              $dll.Name -match "^liborc.*\.dll$" -or
              $dll.Name -match "^ffi.*\.dll$" -or
              $dll.Name -match "^pcre.*\.dll$" -or
              $dll.Name -match "^intl.*\.dll$"
            ) {

              Copy-Item `
                $dll.FullName `
                (Join-Path $gst "bin") `
                -Force

              Write-Host "Copied:" $dll.Name
            }
          }


      # ============================================================
      # COPY GSTREAMER PLUGINS
      # ============================================================

      - name: Copy GStreamer plugins
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          $gst = Join-Path `
            $app `
            "gstreamer"

          $site = python -c "import site; print(site.getsitepackages()[0])"

          $pluginDestination = Join-Path `
            $gst `
            "lib\gstreamer-1.0"

          Write-Host "=========================================="
          Write-Host "GStreamer plugins"
          Write-Host "=========================================="

          $plugins = Get-ChildItem `
            $site `
            -Recurse `
            -File `
            -Filter "*.dll"

          foreach ($plugin in $plugins) {

            if (
              $plugin.Name -match "^gst.*\.dll$" -or
              $plugin.Name -match "^libgst.*\.dll$"
            ) {

              Copy-Item `
                $plugin.FullName `
                $pluginDestination `
                -Force

              Write-Host "Plugin:" $plugin.Name
            }
          }


      # ============================================================
      # COPY GI TYPELIBS
      # ============================================================

      - name: Copy GI typelibs
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          $gst = Join-Path `
            $app `
            "gstreamer"

          $destination = Join-Path `
            $gst `
            "lib\girepository-1.0"

          $site = python -c "import site; print(site.getsitepackages()[0])"

          Write-Host "=========================================="
          Write-Host "GI typelibs"
          Write-Host "=========================================="

          $typelibs = Get-ChildItem `
            $site `
            -Recurse `
            -File `
            -Filter "*.typelib"

          foreach ($file in $typelibs) {

            Copy-Item `
              $file.FullName `
              $destination `
              -Force

            Write-Host "Typelib:" $file.Name
          }


      # ============================================================
      # COPY GIREPOSITORY / PYGI DLL
      # ============================================================

      - name: Copy PyGObject runtime DLLs
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          $gst = Join-Path `
            $app `
            "gstreamer"

          $site = python -c "import site; print(site.getsitepackages()[0])"

          Write-Host "=========================================="
          Write-Host "PyGObject runtime"
          Write-Host "=========================================="

          $dlls = Get-ChildItem `
            $site `
            -Recurse `
            -File `
            -Filter "*.dll"

          foreach ($dll in $dlls) {

            if (
              $dll.Name -match "girepository" -or
              $dll.Name -match "libffi" -or
              $dll.Name -match "glib" -or
              $dll.Name -match "gobject"
            ) {

              Copy-Item `
                $dll.FullName `
                (Join-Path $gst "bin") `
                -Force

              Write-Host "PyGObject DLL:" $dll.Name
            }
          }


      # ============================================================
      # VERIFY GSTREAMER
      # ============================================================

      - name: Verify GStreamer runtime
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          Write-Host "=========================================="
          Write-Host "GStreamer runtime verification"
          Write-Host "=========================================="

          $bin = Join-Path $app "gstreamer\bin"
          $plugins = Join-Path $app "gstreamer\lib\gstreamer-1.0"
          $typelib = Join-Path $app "gstreamer\lib\girepository-1.0"

          Write-Host ""
          Write-Host "DLL count:"
          (Get-ChildItem $bin -File -ErrorAction SilentlyContinue).Count

          Write-Host ""
          Write-Host "Plugin count:"
          (Get-ChildItem $plugins -File -ErrorAction SilentlyContinue).Count

          Write-Host ""
          Write-Host "Typelib count:"
          (Get-ChildItem $typelib -File -ErrorAction SilentlyContinue).Count

          if (
            -not (Test-Path $bin) -or
            -not (Test-Path $plugins) -or
            -not (Test-Path $typelib)
          ) {
            Write-Error "GStreamer runtime directory tidak lengkap."
            exit 1
          }


      # ============================================================
      # RUNTIME TEST
      # ============================================================

      - name: Testing amarPlayer GUI runtime
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          Write-Host "=========================================="
          Write-Host "Testing amarPlayer GUI runtime"
          Write-Host "=========================================="

          $env:PYGI_DLL_DIRS = "$app\gstreamer;$app"
          $env:PYGI_DLL_PATH = "$app\gstreamer;$app"

          $env:PATH = `
            "$app\gstreamer\bin;$app;$env:PATH"

          $env:GST_PLUGIN_PATH = `
            "$app\gstreamer\lib\gstreamer-1.0"

          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = ""

          $env:GI_TYPELIB_PATH = `
            "$app\gstreamer\lib\girepository-1.0"

          Write-Host "PYGI_DLL_DIRS:"
          Write-Host $env:PYGI_DLL_DIRS

          Write-Host ""
          Write-Host "PYGI_DLL_PATH:"
          Write-Host $env:PYGI_DLL_PATH

          Write-Host ""
          Write-Host "GST_PLUGIN_PATH:"
          Write-Host $env:GST_PLUGIN_PATH

          Write-Host ""
          Write-Host "GI_TYPELIB_PATH:"
          Write-Host $env:GI_TYPELIB_PATH

          Write-Host ""
          Write-Host "Starting amarPlayer.exe..."

          $exe = Join-Path `
            $app `
            "amarPlayer.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "amarPlayer.exe tidak ditemukan."
            exit 1
          }

          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory $app `
            -PassThru

          $finished = $process.WaitForExit(15000)

          if (-not $finished) {

            Write-Host ""
            Write-Host "amarPlayer.exe masih berjalan setelah 15 detik."
            Write-Host "GUI application berjalan normal."
            Write-Host "GUI runtime TEST PASSED."

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue

            exit 0
          }

          Write-Host ""
          Write-Host "amarPlayer.exe berhenti."
          Write-Host "Exit code: $($process.ExitCode)"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Nuitka stdout diagnostic"
          Write-Host "=========================================="

          $stdoutLog = Join-Path `
            $app `
            "amarPlayer.out.txt"

          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog
          }
          else {
            Write-Host "stdout diagnostic tidak ditemukan."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Nuitka stderr diagnostic"
          Write-Host "=========================================="

          $stderrLog = Join-Path `
            $app `
            "amarPlayer.err.txt"

          if (Test-Path $stderrLog) {
            Get-Content $stderrLog
          }
          else {
            Write-Host "stderr diagnostic tidak ditemukan."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GStreamer plugins"
          Write-Host "=========================================="

          Get-ChildItem `
            "$app\gstreamer\lib\gstreamer-1.0" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GStreamer DLL"
          Write-Host "=========================================="

          Get-ChildItem `
            "$app\gstreamer\bin" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length

          Write-Error "GUI runtime gagal."
          exit 1


      # ============================================================
      # CREATE WINDOWS LAUNCHER
      # ============================================================

      - name: Create Windows launcher
        shell: powershell
        run: |
          $app = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\amarPlayer.dist"

          $launcher = Join-Path `
            $app `
            "amarPlayer.cmd"

          $content = @(
            '@echo off'
            'set "HERE=%~dp0"'
            ''
            'set "PYGI_DLL_DIRS=%HERE%gstreamer;%HERE%"'
            'set "PYGI_DLL_PATH=%HERE%gstreamer;%HERE%"'
            ''
            'set "PATH=%HERE%gstreamer\bin;%HERE%;%PATH%"'
            ''
            'set "GST_PLUGIN_PATH=%HERE%gstreamer\lib\gstreamer-1.0"'
            'set "GST_PLUGIN_SYSTEM_PATH_1_0="'
            ''
            'set "GI_TYPELIB_PATH=%HERE%gstreamer\lib\girepository-1.0"'
            ''
            '"%HERE%amarPlayer.exe" %*'
          )

          Set-Content `
            -Path $launcher `
            -Value $content `
            -Encoding ASCII


      # ============================================================
      # CREATE INNO SETUP SCRIPT
      # ============================================================

      - name: Create Inno Setup script
        shell: powershell
        run: |
          $installerDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer"

          $issPath = Join-Path `
            $installerDir `
            "amarPlayer.iss"

          $content = @(
            '#define MyAppName "amarPlayer"'
            '#define MyAppVersion "1.0.0"'
            '#define MyAppPublisher "Muammar"'
            '#define MyAppExeName "amarPlayer.exe"'
            ''
            '[Setup]'
            'AppId={{B7E7D0B7-0F57-4C0B-A8D1-8F3B8B5B6A01}'
            'AppName={#MyAppName}'
            'AppVersion={#MyAppVersion}'
            'AppPublisher={#MyAppPublisher}'
            'DefaultDirName={localappdata}\Programs\amarPlayer'
            'DefaultGroupName=amarPlayer'
            'PrivilegesRequired=lowest'
            'OutputDir=..\release'
            'OutputBaseFilename=amarPlayer-Setup-Windows-x64'
            'Compression=lzma'
            'SolidCompression=yes'
            'WizardStyle=modern'
            'UninstallDisplayIcon={app}\amarPlayer.exe'
            'ArchitecturesAllowed=x64compatible'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'DisableProgramGroupPage=yes'
            ''
            '[Files]'
            'Source: "..\build\amarPlayer.dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "Buat shortcut di Desktop"; GroupDescription: "Shortcut tambahan:"'
            ''
            '[Icons]'
            'Name: "{autoprograms}\amarPlayer"; Filename: "{app}\amarPlayer.exe"'
            'Name: "{autodesktop}\amarPlayer"; Filename: "{app}\amarPlayer.exe"; Tasks: desktopicon'
            ''
            '[Registry]'
            'Root: HKCU; Subkey: "Software\Classes\Applications\amarPlayer.exe"; ValueType: string; ValueName: "FriendlyAppName"; ValueData: "amarPlayer"; Flags: uninsdeletekey'
            'Root: HKCU; Subkey: "Software\Classes\Applications\amarPlayer.exe\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\amarPlayer.exe"" ""%1"""; Flags: uninsdeletevalue'
          )

          Set-Content `
            -Path $issPath `
            -Value $content `
            -Encoding UTF8

          Write-Host "Inno Setup script:"
          Get-Content $issPath


      # ============================================================
      # FIND INNO SETUP
      # ============================================================

      - name: Locate Inno Setup
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Locate Inno Setup"
          Write-Host "=========================================="

          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $iscc = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $iscc = $path
              break
            }
          }

          if (-not $iscc) {
            Write-Host "ISCC.exe tidak ditemukan."
            Write-Host "Installing Inno Setup..."

            choco install innosetup `
              --no-progress `
              -y

            foreach ($path in $paths) {
              if (Test-Path $path) {
                $iscc = $path
                break
              }
            }
          }

          if (-not $iscc) {
            Write-Error "Inno Setup / ISCC.exe tidak ditemukan."
            exit 1
          }

          Write-Host "ISCC:"
          Write-Host $iscc

          & $iscc /? | Select-Object -First 5


      # ============================================================
      # BUILD INSTALLER
      # ============================================================

      - name: Build Windows x64 installer
        shell: powershell
        run: |
          $iss = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer\amarPlayer.iss"

          $iscc = $null

          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $iscc = $path
              break
            }
          }

          if (-not $iscc) {
            Write-Error "ISCC.exe tidak ditemukan."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "Building Windows x64 installer"
          Write-Host "=========================================="

          & $iscc `
            /Q `
            $iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup gagal."
            exit $LASTEXITCODE
          }


      # ============================================================
      # VERIFY INSTALLER
      # ============================================================

      - name: Verify Windows installer
        shell: powershell
        run: |
          $installer = Join-Path `
            $env:GITHUB_WORKSPACE `
            "release\amarPlayer-Setup-Windows-x64.exe"

          Write-Host "=========================================="
          Write-Host "Installer verification"
          Write-Host "=========================================="

          if (-not (Test-Path $installer)) {
            Write-Error "Installer tidak ditemukan."
            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "Installer:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host $file.Length "bytes"

          if ($file.Length -lt 1MB) {
            Write-Error "Ukuran installer terlalu kecil."
            exit 1
          }

          Write-Host ""
          Write-Host "INSTALLER TEST PASSED."


      # ============================================================
      # UPLOAD INSTALLER
      # ============================================================

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64
          path: release/amarPlayer-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # UPLOAD DEBUG BUILD
      # ============================================================

      - name: Upload Windows build for debugging
        uses: actions/upload-artifact@v4
        with:
          name: amarPlayer-Windows-x64-debug
          path: |
            build/amarPlayer.dist/amarPlayer.exe
            build/amarPlayer.dist/amarPlayer.err.txt
            build/amarPlayer.dist/amarPlayer.out.txt
            build/amarPlayer.dist/amarPlayer.cmd
          if-no-files-found: warn
          retention-days: 7
